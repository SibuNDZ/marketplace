spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    validate-on-migrate: true
    # TODO: Upgrade Flyway when its supported PostgreSQL range includes 18;
    # Railway currently runs PostgreSQL 18 and Flyway reports a compatibility notice.
    # If prod already has a schema WITH DATA when Flyway first runs (Railway etc.),
    # set these for the first deployment only, then remove them:
    #   baseline-on-migrate: true
    #   baseline-version: 1

server:
  # Railway injects PORT and probes it; server.port in application.yml already
  # maps it via ${PORT:8080}. forward-headers-strategy makes URL building
  # (redirects, springdoc, Location headers) honour X-Forwarded-Proto/Host.
  # It also does more than that, and none of it helps the rate limiter: in
  # spring-web 6.2 ForwardedHeaderFilter answers getRemoteAddr() with the
  # LEFTMOST X-Forwarded-For entry (client-written) and hides the header
  # from every later filter. Treat getRemoteAddr() as untrusted after it;
  # AuthRateLimitFilter.clientIp reads the original header beneath it.
  # Safe on Railway (edge controls X-Forwarded-For); do NOT set this on
  # deployments where clients reach the app directly (header spoofing).
  forward-headers-strategy: framework

# JWT_SECRET must be supplied via environment variable in production.
# No default — missing variable = startup failure (intentional fail-fast).
app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false  # no API spec leakage in prod
  swagger-ui:
    enabled: false  # SecurityConfig permitAll lines become harmless 404s

logging:
  level:
    com.marketplace.api: INFO
    org.springframework.web: WARN
    # Override application.yml's DEBUG setting so Hibernate SQL stays off in
    # prod. logback-spring.xml also sets this, but Spring Boot's logging.level
    # binding runs after logback config and would win — so both are needed.
    org.hibernate.SQL: WARN