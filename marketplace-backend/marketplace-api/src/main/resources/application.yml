# Server Configuration
server:
  port: ${PORT:8080}  # Railway injects PORT; without this mapping Spring listens
                       # on 8080 while Railway probes the injected port — deploy loops.

# Spring Configuration
spring:
  application:
    name: marketplace-api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB   # headroom over the file cap for multipart framing

  # JPA/Hibernate Configuration — Flyway owns the schema; Hibernate audits it
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # HikariCP — return connections with autoCommit=false so that
  # @Transactional + native FOR UPDATE locks are transaction-scoped
  # (auto_commit=true causes FOR UPDATE to release the lock after the
  # single statement, defeating pessimistic locking between threads).
  datasource:
    hikari:
      auto-commit: false

  # Flyway — migrations live in db/migration, executed before Hibernate validates
  flyway:
    enabled: true
    locations: classpath:db/migration

# Logging Configuration
logging:
  level:
    com.marketplace.api: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health  # health only — hide info/metrics from unauthenticated callers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true    # exposes /actuator/health/liveness + /readiness

# Application Configuration
app:
  jwt:
    # No default — app fails fast at startup if JWT_SECRET is not set.
    # Dev fallback lives in application-dev.yml only.
    secret: ${JWT_SECRET}
    # 15 minutes: short enough to limit a leaked token's window; refresh
    # tokens extend the session without forcing re-login.
    expiry-seconds: ${JWT_EXPIRY_SECONDS:900}
    # 7 days: refresh token lifetime. Rotate-on-use means an active user
    # never actually sees this expiry; it bounds abandoned sessions.
    refresh-expiry-seconds: ${REFRESH_TOKEN_EXPIRY_SECONDS:604800}
  # Single source of truth for "where does the browser live". The Stripe
  # return URLs below and the links in verification/reset emails all derive
  # from it — three places that must never disagree.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  email:
    # Blank disables sending and logs the link instead (see EmailService).
    # Deliberately NOT fail-fast like JWT_SECRET: a missing key here means
    # the resend button is a no-op, not a crash loop.
    resend-api-key: ${RESEND_API_KEY:}
    from: ${APP_EMAIL_FROM:eRestyu <noreply@erestyu.com>}
  tokens:
    # 24h: people register on a phone and read mail on a laptop later. The
    # cost of expiry is a resend.
    verification-expiry-seconds: ${VERIFICATION_TOKEN_EXPIRY_SECONDS:86400}
    # 1h: a reset link is an account-takeover primitive sitting in an inbox.
    reset-expiry-seconds: ${RESET_TOKEN_EXPIRY_SECONDS:3600}
  embeddings:
    # Voyage AI. Anthropic does not offer an embedding model, so the
    # ANTHROPIC_API_KEY below cannot serve this — it is a separate provider
    # and a separate key.
    #
    # Blank default for the same fault-isolation reason as the AI key: with
    # no key the sweep is inert and related-products falls back to the
    # lexical path (V21). Missing embeddings must never be a boot failure or
    # an empty shelf.
    api-key: ${VOYAGE_API_KEY:}
    # voyage-4: 1024 dimensions, unit-normalised, so cosine == dot product.
    model: voyage-4
    # One batch every 5 minutes. Deliberately unhurried — the catalogue is
    # small, embeddings only change when a vendor edits text, and a slow
    # sweep cannot stampede the provider.
    sweep-ms: 300000
    initial-delay-ms: 20000
    batch-size: 16

  ai:
    # Blank default, NOT fail-fast. Unlike JWT_SECRET, a missing key here must
    # degrade to "the draft button 500s" rather than a boot failure — see
    # AnthropicConfig for the fault-isolation rationale.
    api-key: ${ANTHROPIC_API_KEY:}
    # Sonnet-class: this is a short image->JSON extraction on a cost-per-call
    # endpoint, not reasoning work. Verified against the model docs.
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
    rate-limit:
      # Per authenticated vendor, not per IP. Each call costs real money.
      per-hour: ${DRAFT_RATE_LIMIT_PER_HOUR:10}
  stripe:
    # Blank defaults: PaymentsConfigValidator fail-fastes ONLY when
    # PAYMENTS_PROVIDER=stripe. A PayFast/Yoco deploy must not die because
    # STRIPE_SECRET_KEY is unset.
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${APP_FRONTEND_URL:http://localhost:5173}/checkout/success
    cancel-url: ${APP_FRONTEND_URL:http://localhost:5173}/checkout/cancelled
  payments:
    # Cutover switch: stripe | payfast | yoco. Stripe remains the default and
    # the rollback until the first real rand clears end to end on the new
    # provider (payfast-port.md).
    provider: ${PAYMENTS_PROVIDER:stripe}
  yoco:
    # Blank defaults, NOT sandbox defaults: Yoco test keys are per-merchant
    # (Yoco app -> Checkout API integration -> Test keys), so there is no
    # public pair to ship. Blank + PaymentsConfigValidator means an unset
    # key fails the boot ONLY on a deploy that selects yoco, and never
    # breaks a Stripe deploy that has no Yoco vars at all.
    secret-key: ${YOCO_SECRET_KEY:}
    webhook-secret: ${YOCO_WEBHOOK_SECRET:}
    checkouts-url: ${YOCO_CHECKOUTS_URL:https://payments.yoco.com/api/checkouts}
    # Yoco has three return URLs where Stripe has two: a cancelled checkout
    # and a FAILED one are different events. Both land on our cancelled page
    # for now — the page reads the order and polls, so it tells the truth
    # either way.
    success-url: ${APP_FRONTEND_URL:http://localhost:5173}/checkout/success
    cancel-url: ${APP_FRONTEND_URL:http://localhost:5173}/checkout/cancelled
    failure-url: ${APP_FRONTEND_URL:http://localhost:5173}/checkout/cancelled
    # Yoco's docs recommend "up to 3 minutes" for replay defence.
    webhook-tolerance-seconds: ${YOCO_WEBHOOK_TOLERANCE_SECONDS:180}
  payfast:
    # Blank merchant id/key, same fail-fast as Yoco/Stripe: the public
    # sandbox demo pair must not ship in defaults. PaymentsConfigValidator
    # refuses a payfast boot when these are empty. Tests stub keys in
    # src/test/resources/application.yml.
    merchant-id: ${PAYFAST_MERCHANT_ID:}
    merchant-key: ${PAYFAST_MERCHANT_KEY:}
    passphrase: ${PAYFAST_PASSPHRASE:}
    process-url: ${PAYFAST_PROCESS_URL:https://sandbox.payfast.co.za/eng/process}
    validate-url: ${PAYFAST_VALIDATE_URL:https://sandbox.payfast.co.za/eng/query/validate}
    return-url: ${APP_FRONTEND_URL:http://localhost:5173}/checkout/success
    cancel-url: ${APP_FRONTEND_URL:http://localhost:5173}/checkout/cancelled
    notify-url: ${PAYFAST_NOTIFY_URL:http://localhost:8080/api/v1/payments/payfast/itn}
    # Source-IP gate for the ITN. On in production; off locally, where
    # notifications arrive through tunnels with rewritten hops.
    verify-source: ${PAYFAST_VERIFY_SOURCE:false}
  orders:
    expiry-sweep-ms: 60000
  feedback:
    rate-limit:
      per-hour: ${FEEDBACK_RATE_LIMIT_PER_HOUR:5}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  discovery:
    popularity-refresh-ms: 3600000        # hourly
    view-retention-cron: "0 15 3 * * *"   # nightly sweep, 90-day window
    demand:
      # Floor for the product page's "N people bought this in the last 24
      # hours" line. Below this the API returns null and no line renders.
      #
      # 3 because "1 person bought this" is worse than saying nothing: it is
      # an urgency badge that advertises an empty shop. Production sits at 0
      # for every product today, so this is inert by design and switches on
      # by itself once real orders arrive.
      min-buyers: ${DEMAND_MIN_BUYERS:3}
    similar:
      # Cosine floor for "related". Measured against the live catalogue:
      # genuine matches ran 0.610-0.747 and the nearest unrelated product sat
      # at 0.507, so this falls inside a real gap. Raise it if unrelated
      # products appear, lower it if obvious pairs go missing.
      min-similarity: ${SIMILAR_MIN_SIMILARITY:0.55}
      # How much rating/sales/views may move the order. Multiplicative, so
      # 0.15 means a flawless product ranks at most 15% above an identically
      # relevant one. Push this high and the shelf becomes a bestseller list
      # that ignores what the shopper is actually looking at.
      quality-weight: ${SIMILAR_QUALITY_WEIGHT:0.15}
      # Max products per vendor on one shelf. One stall owns half this
      # catalogue today, and without a cap its listings fill every shelf on
      # the site. Never shrinks a shelf — capped items refill empty slots.
      vendor-cap: ${SIMILAR_VENDOR_CAP:2}
  storage:
    r2:
      # Fail-fast, no defaults — same philosophy as JWT_SECRET/STRIPE_SECRET_KEY.
      account-id: ${R2_ACCOUNT_ID}
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      bucket: erestyu-images
      public-base-url: https://images.erestyu.com
      # Blank in every real environment — tests point this at a MinIO
      # testcontainer via @DynamicPropertySource.
      endpoint-override: ${R2_ENDPOINT_OVERRIDE:}

sentry:
  dsn: ${SENTRY_DSN:}             # blank = SDK disabled; dev needs nothing
  environment: ${SPRING_PROFILES_ACTIVE:dev}
  traces-sample-rate: 0.0       # errors only; perf tracing later if ever
  logging:
    minimum-event-level: error  # every log.error() becomes a Sentry event