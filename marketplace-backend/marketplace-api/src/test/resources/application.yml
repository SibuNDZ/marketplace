# Test-environment overrides for properties that have no application.yml default
# (fail-fast properties that require real env vars in production).
# These placeholder values are safe for test runs — no real Stripe account is hit.

# HikariCP: return connections with autoCommit=false so that @Transactional
# + SELECT ... FOR UPDATE locks are transaction-scoped (not auto-released after
# each statement). This is correct for any JPA application and is critical for
# the cart pessimistic-locking mechanism in OrderService.
spring:
  datasource:
    hikari:
      auto-commit: false

app:
  ai:
    # api-key is deliberately blank here and set per-test:
    #   ListingDraftTest gives it a dummy value (the model is mocked anyway),
    #   AnthropicDraftFaultIsolationTest leaves it blank on purpose — that IS
    #   the condition under test.
    api-key: ""
    # model has NO in-code default, so it must be stubbed here or the context
    # cannot start. Tests that mock ListingDraftModel never notice, because the
    # bean needing this is replaced — only the fault-isolation test, which uses
    # the real one, surfaces it. That is why it is easy to miss.
    model: claude-sonnet-5
    max-tokens: 1024
    rate-limit:
      per-hour: 10
  stripe:
    secret-key: sk_test_placeholder_for_tests
    webhook-secret: whsec_placeholder_for_tests
    success-url: http://localhost:4200/checkout/success
    cancel-url: http://localhost:4200/checkout/cancelled
  payments:
    provider: stripe
  yoco:
    # Deterministic so YocoSignatureTest/YocoWebhookTest can pre-compute
    # signatures by hand. The secret must be a real "whsec_<base64>" because
    # verification base64-decodes it — a placeholder like "test-secret" would
    # throw on decode and make every test fail for the wrong reason.
    # Decodes to the ASCII bytes of "yoco-test-webhook-secret-32bytes".
    secret-key: sk_test_placeholder_for_tests
    webhook-secret: whsec_eW9jby10ZXN0LXdlYmhvb2stc2VjcmV0LTMyYnl0ZXM=
    # No outbound call happens in tests; the checkout HTTP seam is pointed at
    # a local stub server by the tests that exercise it.
    checkouts-url: http://localhost:9/api/checkouts
    success-url: http://localhost:4200/checkout/success
    cancel-url: http://localhost:4200/checkout/cancelled
    failure-url: http://localhost:4200/checkout/cancelled
    webhook-tolerance-seconds: 180
  payfast:
    # Deterministic values so PayfastItnTest can pre-compute signatures.
    # No outbound calls happen in tests: the validator seam is stubbed.
    merchant-id: "10000100"
    merchant-key: 46f0cd694581a
    passphrase: test-passphrase
    process-url: https://sandbox.payfast.co.za/eng/process
    validate-url: https://sandbox.payfast.co.za/eng/query/validate
    return-url: http://localhost:4200/checkout/success
    cancel-url: http://localhost:4200/checkout/cancelled
    notify-url: http://localhost:8080/api/v1/payments/payfast/itn
    verify-source: false
  orders:
    expiry-sweep-ms: 60000
  bootstrap:
    admin-email: ""
    admin-password: ""
  storage:
    r2:
      account-id: test-account-id
      access-key-id: test-access-key-id
      secret-access-key: test-secret-access-key
      bucket: erestyu-images-test
      public-base-url: https://images.erestyu.com
      # Individual tests that actually exercise storage (e.g.
      # ProductImageServiceTest) override account-id/keys/endpoint-override
      # via @DynamicPropertySource to point at a real MinIO testcontainer —
      # these are safe no-op placeholders for every other test.
